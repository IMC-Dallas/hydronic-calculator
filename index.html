<style>
/* (UNCHANGED — your styles exactly) */
body {
  font-family:-apple-system, Arial;
  background:#f2f2f7;
  margin:0;
  padding:10px;
}
.container { max-width:500px; margin:auto; }

/* LOGO */
.logo { display:block; margin:15px auto; width:180px; }
@media (min-width:700px){ .logo { width:240px; } }

/* CARDS */
.card { border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
.card-load {background:#eef6ff;}
.card-flow {background:#e4f1ff;}
.card-settings {background:#d9ecff;}
.card-dp {background:#cfe6ff;}

label { display:block; font-size:13px; font-weight:600; margin-top:10px; margin-bottom:4px; }

input, select {
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button {
  width:100%;
  padding:16px;
  font-size:18px;
  border:none;
  border-radius:12px;
  margin-top:10px;
}

.btn-main { background:#007AFF; color:white; }
.btn-clear { background:#ccc; }

.result {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
  line-height:1.8;
}

.big { font-size:22px; font-weight:bold; margin-top:10px; }

.divider { margin-top:20px; border-top:1px solid #ccc; }

.footer {
  text-align:center;
  font-size:11px;
  color:#666;
  margin-top:10px;
}
</style>

<h3 style="text-align:center;">Hydronic Piping Calculator</h3>

<div class="card card-load">
<label>Cooling Load (kW)</label>
<input id="kw" type="number" step="0.1">
<label>Cooling Load (Tons)</label>
<input id="tons" type="number" step="0.1">
</div>

<div class="card card-flow">
<label>Entered Flow (GPM)</label>
<input id="flow" type="number" step="0.1">
<small><i>*Overrides Cooling Load</i></small>
</div>

<div class="card card-settings">
<label>Fluid</label>
<select id="fluid">
<option>Water</option>
<option>Propylene Glycol 25%</option>
<option>Propylene Glycol 30%</option>
</select>

<label>ΔT (°F)</label>
<input id="dt" type="number" value="20" step="0.1">

<label>Length (ft)</label>
<input id="L" type="number" value="100" step="0.1">
</div>

<div class="card card-dp">
<label>DP Mode</label>
<select id="dp" onchange="updateDP()">
<option>Pipe Only</option>
<option>Use L_eq Only</option>
<option>Use L_eq + Accessory</option>
<option>Override</option>
</select>

<label>L_eq (ft)</label>
<input id="Leq" type="number" value="0" step="0.1">

<label>Accessory ΔH</label>
<input id="acc" type="number" value="0" step="0.1">

<label>Override ΔH</label>
<input id="ovr" type="number" value="0" step="0.1">
</div>

<button class="btn-main" onclick="calc()">Calculate</button>
<button class="btn-clear" onclick="clearAll()">Clear</button>

<div id="out" class="result"></div>

<div class="divider"></div>

<div class="footer">

</div>

<script>
// (UNCHANGED — all your logic exactly)
kw.oninput = () => tons.value = kw.value ? (kw.value/3.517).toFixed(1) : "";
tons.oninput = () => kw.value = tons.value ? (tons.value*3.517).toFixed(1) : "";

function clearAll(){
kw.value=""; tons.value=""; flow.value="";
dt.value="20"; L.value="100";
Leq.value="0"; acc.value="0"; ovr.value="0";
out.innerHTML="";
}

function clamp(v){ return Math.max(0, parseFloat(v)||0); }

function updateDP(){
Leq.disabled=true; acc.disabled=true; ovr.disabled=true;
if(dp.value==="Use L_eq Only") Leq.disabled=false;
if(dp.value==="Use L_eq + Accessory"){Leq.disabled=false; acc.disabled=false;}
if(dp.value==="Override") ovr.disabled=false;
}

const pipes=[
{nps:2,id:2.067},{nps:3,id:3.068},{nps:4,id:4.026},
{nps:5,id:5.047},{nps:6,id:6.065},{nps:8,id:7.981},
{nps:10,id:10.02},{nps:12,id:11.938},{nps:14,id:13.126},
{nps:16,id:15},{nps:18,id:16.876},{nps:20,id:18.812},
{nps:24,id:22.626}
];

function calc(){
let tonsVal=clamp(tons.value);
let flowVal=clamp(flow.value);
let dtVal=clamp(dt.value)||20;

let Qbase = tonsVal * 24 / dtVal;

let factor=1;
if(fluid.value.includes("25")) factor=1.04;
if(fluid.value.includes("30")) factor=1.08;

let Q = (flow.value!=="") ? flowVal : Qbase*factor;

let visc=1;
if(fluid.value.includes("25")) visc=1.25;
if(fluid.value.includes("30")) visc=1.5;

let mode=dp.value;
let Leff = mode.includes("L_eq") ? clamp(Leq.value) : clamp(L.value);

if(mode==="Override"){
out.innerHTML = `
<div class="big">Flow: ${Q.toFixed(1)} GPM</div>
<div class="big">Total ΔH: ${clamp(ovr.value).toFixed(1)} ft</div>`;
return;
}

let best=null;

for(let p of pipes){
let D=p.id/12;
let A=Math.PI*D*D/4;
let V=(Q/448.8)/A;
let HL=(V*V/D)*0.02*visc;
let total=HL*(Leff/100);

if(mode==="Use L_eq + Accessory") total += clamp(acc.value);

if(V<=8 && HL<=4 && !best){
best={p,V,HL,total};
}
}

if(!best){
out.innerHTML="❌ Flow exceeds pipe capacity";
return;
}

out.innerHTML=`
<div class="big">Flow: ${Q.toFixed(1)} GPM</div>
<div class="big">Recommended Pipe Size: ${best.p.nps}"</div>
Velocity: ${best.V.toFixed(2)} ft/s<br>
Headloss: ${best.HL.toFixed(2)} ft/100ft<br>
<div class="big">Total ΔH: ${best.total.toFixed(2)} ft</div>
`;
}

updateDP();


// ✅ ✅ INLINE SERVICE WORKER (NO EXTRA FILE)
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE='calc-v1';
    self.addEventListener('install',e=>{
      e.waitUntil(
        caches.open(CACHE).then(c=>c.addAll(['./']))
      );
    });
    self.addEventListener('fetch',e=>{
      e.respondWith(
        caches.match(e.request).then(r=>r||fetch(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(blob);

  navigator.serviceWorker.register(swURL);
}
</script>

</body>
</html>
